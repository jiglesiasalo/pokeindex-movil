<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PokeIndex · móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--card:#15161b;--card2:#1c1d23;--line:rgba(255,255,255,.08);--ink:#ece9e2;--mute:#9a958a;--y:#FFCB05;--ok:#4fd27a;--buy:#6fa8ff;--miss:#ff8a7a;--pad:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.4 'Manrope',system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
/* bloqueo */
#lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px var(--pad);text-align:center}
#lock img{width:92px;height:92px;border-radius:22px}
#lock h1{margin:0;font-size:22px}#lock p{margin:0;color:var(--mute);max-width:320px}
#lock form{display:flex;flex-direction:column;gap:10px;width:min(340px,100%)}
input[type=password],input[type=search]{width:100%;height:46px;border-radius:12px;border:1px solid #33343b;background:#17181d;padding:0 14px;font-size:16px}
input:focus{outline:none;border-color:var(--y)}
.btn{height:46px;border-radius:12px;border:0;background:var(--y);color:#1a1500;font-weight:800;font-size:15px;cursor:pointer}
.btn.ghost{background:#1d1e24;color:var(--ink);border:1px solid #33343b}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
.err{color:var(--miss);font-size:13px;min-height:18px}
/* cabecera */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,rgba(11,12,16,0));padding:12px var(--pad) 10px;display:flex;align-items:center;gap:10px}
header .back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
header h2{margin:0;font-size:19px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;color:var(--mute);font-size:11.5px;font-weight:600}
main{padding:0 var(--pad)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:4px 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi span{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--mute);font-weight:800}
.kpi b{font-size:19px;font-weight:800}.kpi.pos b{color:var(--ok)}.kpi.neg b,.kpi.miss b{color:var(--miss)}
.ksel{position:relative;display:flex;justify-content:flex-end;margin:-6px 0 8px}
.ksel-b{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:12.5px}
.ksel-b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ksel-b i{font-style:normal;color:var(--y)}
.ksel-p{position:absolute;right:0;top:38px;z-index:25;min-width:240px;max-width:100%;padding:8px;border-radius:14px;background:#17181d;border:1px solid #33343b;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.ksel-p label{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;font-weight:700}
.ksel-p input{width:20px;height:20px;accent-color:var(--y)}.ksel-p small{margin-left:auto;color:var(--mute);font-weight:600}
.ksel-a{display:flex;gap:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}.ksel-a button{flex:1;height:36px;border-radius:10px;border:1px solid #33343b;background:none;font-weight:700;font-size:13px}
.kpi.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}
.sec{font-size:11px;letter-spacing:.16em;color:var(--mute);font-weight:800;margin:18px 2px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;text-align:left;cursor:pointer}
.row .ic{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#22232a;flex:0 0 auto}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{color:var(--mute);font-size:12px}
.row .v{font-weight:800;white-space:nowrap}
.bar{height:5px;border-radius:9px;background:#26272e;overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%}.bar .g{background:var(--y)}.bar .c{background:var(--buy)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
/* cuadrícula de cartas */
.pg{margin:6px 0 4px;font-size:12px;color:var(--mute);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid.auto{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.slot{position:relative;aspect-ratio:.716;border-radius:6px;background:#17181c;border:1px dashed #26272d;overflow:hidden;padding:0;cursor:pointer}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.miss img{filter:grayscale(1) brightness(.55)}
.slot .st{position:absolute;left:3px;top:3px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.6)}
.slot .pr{position:absolute;left:0;right:0;bottom:0;padding:10px 3px 2px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:9.5px;font-weight:800;text-align:right}
.slot .nm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4px;font-size:9px;color:var(--mute);text-align:center}
.slot.empty{cursor:default}
.ok{background:var(--ok)}.buy{background:var(--buy)}.mis{background:var(--miss)}
/* filtros */
.seg{display:flex;gap:6px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
.seg button{flex:0 0 auto;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px}
.seg button.on{background:var(--y);color:#1a1500;border-color:var(--y)}
.tools{display:flex;gap:8px;margin-bottom:8px}.tools select{height:46px;border-radius:12px;border:1px solid #33343b;background:#17181d;padding:0 10px;max-width:42%}
/* ficha */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
@keyframes fi{from{opacity:0}}
#sheet .in{width:min(560px,100%);max-height:94vh;overflow:auto;background:#121317;border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:14px var(--pad) calc(22px + env(safe-area-inset-bottom));animation:su .25s cubic-bezier(.2,.8,.2,1)}
@keyframes su{from{transform:translateY(40px)}}
.grab{width:42px;height:5px;border-radius:9px;background:#3a3b42;margin:0 auto 12px}
.big{display:block;width:min(72vw,300px);margin:0 auto 14px;border-radius:14px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
#sheet h3{margin:0 0 6px;font-size:20px;line-height:1.2}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.kv span{display:block;font-size:11px;color:var(--mute);font-weight:700}.kv b{font-size:15px}
.kv .w{grid-column:1/-1}
.link{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:12px;background:#1d1e24;border:1px solid #33343b;color:var(--y);font-weight:800;text-decoration:none}
/* barra inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(14,15,19,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:60px;border:0;background:none;color:var(--mute);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--y)}
/* fundas PSA */
.slab{position:relative;aspect-ratio:.62;border-radius:7px;background:linear-gradient(180deg,#77797e,#55575c 18%,#4a4c50 60%,#5c5e62);padding:5%;display:flex;flex-direction:column;gap:4%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.slab .lb{background:#d41f2b;border-radius:3px;padding:4%}.slab .lb div{background:#f7f6f2;border-radius:2px;padding:3% 4%;color:#222;font:600 7px/1.25 Arial,sans-serif;display:flex;justify-content:space-between;gap:4px}
.slab .lb div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slab .wn{flex:1;min-height:0;background:#2b2c2f;border-radius:4px;display:flex;align-items:center;justify-content:center;padding:6%}
.slab .wn img{max-width:100%;max-height:100%;border-radius:4px}
.empty-msg{color:var(--mute);text-align:center;padding:30px 10px}
.foot{color:var(--mute);font-size:11.5px;text-align:center;margin:22px 0 6px}
.load{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:#1d1e24;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700}

body.noscroll{overflow:hidden}
#sheet{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 30%,#1b1d26,#07080b 70%);display:block;overflow-y:auto;overscroll-behavior:contain;animation:fi .2s;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
#sheet .zt{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 8px;background:linear-gradient(#07080b 60%,transparent)}
#sheet .zc{color:var(--mute);font-size:12px;font-weight:700}
#sheet .zx{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:16px}
#sheet .zs{display:flex;align-items:center;justify-content:center;gap:6px;padding:18px 6px 10px;perspective:1100px}
#sheet .zs.inr .tc{animation:zr .28s ease-out}#sheet .zs.inl .tc{animation:zl .28s ease-out}
@keyframes zr{from{transform:translateX(40px);opacity:0}}@keyframes zl{from{transform:translateX(-40px);opacity:0}}
.zn{flex:0 0 34px;height:54px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:26px;line-height:1}
.zn:disabled{opacity:.2}
.tc{position:relative;width:min(70vw,340px);aspect-ratio:.716;border-radius:4.6%/3.3%;overflow:hidden;transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 26px 50px rgba(0,0,0,.65);touch-action:none;user-select:none;-webkit-user-select:none}
.tc.live{transition:transform .06s}
.tc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tc-holo,.tc-glare{position:absolute;inset:0;pointer-events:none;opacity:var(--o,0);transition:opacity .3s}
.tc-holo{mix-blend-mode:color-dodge;opacity:calc(var(--o,0)*.45);background:repeating-linear-gradient(110deg,hsl(0 90% 60%) 0,hsl(50 95% 60%) 5%,hsl(140 80% 55%) 10%,hsl(200 95% 60%) 15%,hsl(280 90% 66%) 20%,hsl(360 90% 60%) 25%);background-size:300% 300%;background-position:var(--x,50%) var(--y,50%);
  -webkit-mask:radial-gradient(circle at var(--x,50%) var(--y,50%),#000 0,rgba(0,0,0,.5) 30%,transparent 70%);mask:radial-gradient(circle at var(--x,50%) var(--y,50%),#000 0,rgba(0,0,0,.5) 30%,transparent 70%)}
.tc-glare{mix-blend-mode:overlay;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.75),transparent 55%)}
#sheet .in{max-width:560px;margin:0 auto;padding:6px var(--pad) 0}
#sheet.expo{overflow:hidden}#sheet.expo .in,#sheet.expo .zn{display:none}#sheet.expo .zs{min-height:calc(100dvh - 90px);padding:0}
#sheet.expo .tc{width:min(94vw,calc((100dvh - 110px)*.716))}
.zh{color:var(--mute);font-size:11.5px;text-align:center;margin:14px 0 0}
.kv .pos b{color:var(--ok)}.kv .neg b{color:var(--miss)}
.chip.st-ok{border-color:rgba(79,210,122,.45);color:#a6f2b8}.chip.st-buy{border-color:rgba(111,168,255,.45);color:#b9d3ff}.chip.st-mis{border-color:rgba(255,138,122,.45);color:#FFB2A6}
/* ===================== v117 · PokeIndex móvil ===================== */
#parts{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;background:radial-gradient(120vw 80vh at 80% 0%,color-mix(in srgb,var(--reg0,#ffcb05) 12%,transparent),transparent 70%)}
header{flex-wrap:wrap}
.lang-chip{height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:12px;color:var(--mute);white-space:nowrap}
.lang-chip.on{border-color:var(--y);color:var(--y)}
/* portadas */
.cov{--fc:#2f6fd0;--sp:#2a2a2e;position:relative;display:block;aspect-ratio:.78;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 14px 26px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08);
  background:radial-gradient(ellipse at 45% 30%,#2b2b2f,#121214 72%)}
.cov[data-fin="marron"]{background:radial-gradient(ellipse at 45% 30%,#6b4128,#2c180d 75%)}
.cov[data-fin="carbono"]{background:repeating-linear-gradient(45deg,#1b1c1f 0 3px,#121315 3px 6px),#111}
.cov[data-fin="oro"]{background:linear-gradient(135deg,#7a5a12,#f2d27a 30%,#9c7419 55%,#f7e2a0 75%,#7a5a12)}
.cov[data-fin="emblema"],.cov[data-fin="color"]{background:radial-gradient(ellipse at 52% 36%,color-mix(in srgb,var(--fc) 70%,#fff 10%),color-mix(in srgb,var(--fc) 55%,#000) 75%)}
.cov[data-fin="terciopelo"]{background:radial-gradient(ellipse at 45% 30%,color-mix(in srgb,var(--fc,#5a1430) 80%,#fff 8%),color-mix(in srgb,var(--fc,#5a1430) 50%,#000) 75%)}
.cov[data-fin="holo"]{background:linear-gradient(115deg,#15171d,#2a1e3a 30%,#14303a 55%,#3a3010 75%,#15171d)}
.cov[data-fin="madera"]{background:repeating-linear-gradient(92deg,#5b3a1e 0 4px,#4a2e17 4px 7px,#664224 7px 12px)}
.cov[data-fin="cristal"]{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 45%,rgba(255,255,255,.14))}
.cov[data-fin="metal"]{background:repeating-linear-gradient(90deg,#8c9096 0 1px,#a6aab0 1px 2px,#7f8389 2px 3px)}
.cov[data-fin="tela"]{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 45% 30%,#3d4652,#232a33 70%)}
.cov[data-fin="polipiel"]{background:radial-gradient(circle at 2px 2px,rgba(255,255,255,.07) 0 1.2px,transparent 1.6px) 0 0/6px 6px,radial-gradient(ellipse at 45% 30%,#5a2a22,#2a1310 72%)}
.cov-spine{position:absolute;left:0;top:0;bottom:0;width:9%;background:linear-gradient(90deg,#020202,var(--sp) 45%,#0b0b0c);box-shadow:1px 0 0 rgba(255,255,255,.12)}
.cov-stitch{position:absolute;inset:6% 6% 6% 14%;border:1px dashed rgba(255,235,190,.28);border-radius:4px 10px 10px 4px}
.cov-em{position:absolute;left:55%;top:44%;width:52%;aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center}
.cov-em img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.cov-plate{position:absolute;left:20%;right:8%;bottom:9%;padding:5px 4px;border-radius:5px;background:linear-gradient(180deg,#f4f1e6,#cfc7b2);color:#1a1810;font:800 9.5px/1.1 'Manrope',system-ui,sans-serif;letter-spacing:.06em;text-align:center;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.cov-shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:calc(.35 + var(--gl,0)*.5);
  background:radial-gradient(circle at var(--gx,40%) var(--gy,25%),rgba(255,255,255,.4),rgba(255,255,255,.08) 30%,transparent 58%),linear-gradient(115deg,transparent calc(var(--gx,40%) - 30%),rgba(255,255,255,.14) var(--gx,40%),transparent calc(var(--gx,40%) + 30%))}
.cov[data-fin="holo"] .cov-shine{background:radial-gradient(circle at var(--gx,40%) var(--gy,25%),rgba(255,255,255,.35),transparent 50%),linear-gradient(115deg,transparent 10%,rgba(255,80,160,.45) calc(var(--gx,40%) - 10%),rgba(80,220,255,.45) var(--gx,40%),rgba(255,240,90,.4) calc(var(--gx,40%) + 12%),transparent 90%)}
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;padding:4px 2px 6px}
.shelf-it{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;text-align:left;color:var(--ink);perspective:700px}
.shelf-it .cov{transition:transform .3s}.shelf-it:active .cov{transform:rotateY(-12deg) scale(.98)}
.shelf-cap{display:flex;justify-content:space-between;gap:6px;align-items:baseline;margin-top:4px}.shelf-cap b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.shelf-cap span{font-weight:800;font-size:13px;white-space:nowrap}
.shelf-it small{color:var(--mute);font-size:11.5px}
/* abrir el binder */
.ob-ov{position:fixed;inset:0;z-index:90;pointer-events:none;perspective:1400px}
.ob-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(30,30,36,.92),rgba(8,8,10,.98) 70%);opacity:0}
.ob-book{position:absolute;transform-origin:0 0;transform-style:preserve-3d;will-change:transform}
.ob-in{position:absolute;inset:0;border-radius:6px 14px 14px 6px;overflow:hidden;background:linear-gradient(90deg,#0d0d10,#1b1b20 8%,#18181c);box-shadow:0 24px 50px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06)}
.ob-grid{position:absolute;inset:7% 7% 7% 9%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:5%}
.ob-s{position:relative;border-radius:3px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);overflow:hidden}
.ob-s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ob-s.miss img{opacity:.35;filter:grayscale(.7)}
.ob-s::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.18),transparent 40%)}
.ob-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.9),rgba(0,0,0,.55));opacity:.85}
.ob-flap{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d}
.ob-flap>.cov,.ob-lin{position:absolute!important;inset:0;width:auto!important;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ob-lin{transform:rotateY(180deg);border-radius:14px 6px 6px 14px;background:radial-gradient(ellipse at 60% 40%,color-mix(in srgb,var(--fc) 40%,#1c1c22),#0e0e12 80%);box-shadow:inset -8px 0 14px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06)}
.ob-lin::before{content:"";position:absolute;inset:8% 9% 8% 7%;border:1px dashed rgba(255,235,190,.18);border-radius:10px 4px 4px 10px}
.cov-fly{position:fixed;z-index:80;transform-origin:0 0;perspective:1000px}
.cov-fly>.cov{position:absolute;inset:0;transform-origin:0 50%;backface-visibility:hidden}
.cov-pages{position:absolute;inset:1% 1% 1% 3%;border-radius:4px 12px 12px 4px;background:repeating-linear-gradient(90deg,#f0eee8 0 1px,#d8d4ca 1px 2px);box-shadow:0 14px 26px rgba(0,0,0,.5)}
.bhead{display:flex;align-items:center;gap:14px;margin:0 0 12px}.bhead .cov{width:84px;flex:0 0 auto}.bhead-t b{display:block;font-size:22px}.bhead-t small{color:var(--mute)}
/* doble página como en el PC */
.bnd{--cols:4;display:grid;grid-template-columns:1fr;gap:10px;padding:10px;border-radius:16px;position:relative;
  background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--rc) 14%,transparent),transparent 70%),linear-gradient(145deg,#1b1b1e,#0e0e10);border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.bnd[data-fin="marron"]{background:linear-gradient(145deg,#3a2414,#1c1009)}
.bnd[data-fin="emblema"],.bnd[data-fin="color"],.bnd[data-fin="terciopelo"]{background:linear-gradient(145deg,color-mix(in srgb,var(--fc) 28%,#111),color-mix(in srgb,var(--fc) 10%,#0a0a0a))}
.bnd[data-fin="madera"]{background:repeating-linear-gradient(92deg,#3b2513 0 4px,#33200f 4px 7px,#402816 7px 12px)}
.bnd[data-fin="metal"]{background:repeating-linear-gradient(90deg,#3a3d42 0 1px,#45484d 1px 2px,#35383d 2px 4px)}
.bnd[data-fin="tela"]{background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),#252c35}
.bnd[data-fin="polipiel"]{background:radial-gradient(circle at 2px 2px,rgba(255,255,255,.05) 0 1.2px,transparent 1.6px) 0 0/6px 6px,#2b1511}
.bnd.inr{animation:pgR .32s ease-out}.bnd.inl{animation:pgL .32s ease-out}
@keyframes pgR{from{transform:translateX(30%) rotateY(-12deg);opacity:.2}}@keyframes pgL{from{transform:translateX(-30%) rotateY(12deg);opacity:.2}}
.bpage{position:relative;padding:8px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.bpage-n{position:absolute;right:10px;top:-2px;font-size:10px;color:var(--mute);font-weight:700}
.bpage.cover-pg{display:none}
.bgrid{grid-template-columns:repeat(var(--cols),1fr);gap:5px;margin-top:8px}
.bgrid .slot{border-style:solid;border-color:rgba(255,255,255,.04);background:rgba(0,0,0,.35)}
@media (orientation:landscape){
  body{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
  .bnd{grid-template-columns:1fr 1fr;gap:0;padding:10px 12px;max-width:calc((100dvh - 120px)*1.9);margin:0 auto}
  .bnd::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:16px;margin-left:-8px;background:linear-gradient(90deg,#030303,#1a1917 40%,#26241f 50%,#121210 60%,#030303);border-radius:4px;z-index:1}
  .bpage{margin:0 10px}
  .bpage.cover-pg{display:flex;align-items:center;justify-content:center}.bpage.cover-pg .cov{width:46%;box-shadow:none;opacity:.85}
  .bpage-n{display:none}
  body.in-spread nav,body.in-spread .bnav{display:none}
  body.in-spread{padding-bottom:env(safe-area-inset-bottom)}
  body.in-spread header{padding:6px var(--pad) 4px}body.in-spread header h2{font-size:15px}body.in-spread header small{display:inline;margin-left:8px}
  body.in-spread .bnd{max-width:min(calc(100vw - 24px),calc((100dvh - 64px)*1.9))}
}
/* brillo de la cuadrícula al inclinar el móvil */
.bgrid .slot:not(.empty)::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:calc(var(--gl,0)*.5);
  background:linear-gradient(115deg,transparent calc(var(--gx,50%) - 25%),rgba(255,255,255,.35) var(--gx,50%),transparent calc(var(--gx,50%) + 25%)),radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,230,180,.25),transparent 60%)}
.slot.dim{opacity:.18}
.bnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 4px}
.bnav button{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700}.bnav button:disabled{opacity:.3}
.bnav-d{color:var(--mute);font-size:12px;font-weight:700}
/* favoritas */
.slot.fav::before{content:"❤";position:absolute;right:3px;top:2px;z-index:2;font-size:11px;color:#ff6b9a;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.heart-pop{position:absolute;left:50%;top:50%;z-index:5;font-style:normal;font-size:38px;color:#ff6b9a;pointer-events:none;transform:translate(-50%,-50%);animation:hp .85s ease-out forwards;text-shadow:0 4px 14px rgba(0,0,0,.6)}
@keyframes hp{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25);opacity:1}55%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-110%) scale(1.1);opacity:0}}
/* buscar por voz */
.mic{flex:0 0 46px;height:46px;border-radius:12px;border:1px solid #33343b;background:#17181d;font-size:18px}
.mic.on{border-color:#ff6b6b;animation:micP 1s ease-in-out infinite}@keyframes micP{50%{box-shadow:0 0 0 6px rgba(255,107,107,.25)}}
/* ---- zoom realista ---- */
#sheet{background:radial-gradient(ellipse at 50% 28%,color-mix(in srgb,var(--cc,#1b1d26) 55%,#0b0c10),#07080b 72%)!important;transition:background .5s}
.tc3{--th:5px;position:relative;width:min(70vw,340px);aspect-ratio:.716;perspective:1100px;touch-action:none;user-select:none;-webkit-user-select:none}
.tc3 .tc{position:absolute;inset:0;width:auto;aspect-ratio:auto;border-radius:4.6%/3.3%;overflow:visible;transform-style:preserve-3d;box-shadow:none;
  translate:var(--tx,0) var(--ty,0);scale:var(--zz,1);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.tf,.tb{position:absolute;inset:0;border-radius:inherit;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tf{transform:translateZ(calc(var(--th)/2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.tb{transform:rotateY(180deg) translateZ(calc(var(--th)/2));background:#123 url('dorso.webp') center/100% 100% no-repeat}
.tl{position:absolute;inset:0;border-radius:inherit;transform:translateZ(calc(var(--th)/2 - var(--th)*var(--k)/7));background:#e9e6de;pointer-events:none}
.tl:nth-of-type(3),.tl:nth-of-type(4){background:#2a2a2c}
.tf-img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}

.tf-glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:calc(.2 + var(--o,0)*.8);background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.75),transparent 55%)}
.tf-holo,.tf-holo2{position:absolute;inset:0;pointer-events:none;opacity:calc(var(--o,0)*.8)}
.tc3[data-ht="clasico"] .tf-holo{mix-blend-mode:overlay;opacity:calc(var(--o,0)*.9);background:repeating-linear-gradient(110deg,hsl(0 100% 55%) 0,hsl(45 100% 55%) 4%,hsl(120 90% 48%) 8%,hsl(190 100% 52%) 12%,hsl(265 100% 62%) 16%,hsl(330 100% 58%) 20%,hsl(360 100% 55%) 24%);background-size:300% 300%;background-position:var(--x) var(--y);
  clip-path:inset(var(--ay,10%) var(--ax2,7.5%) var(--ay2,47%) var(--ax,7.5%) round 2px)}
.tc3[data-ht="clasico"] .tf-holo2{mix-blend-mode:color-dodge;opacity:calc(var(--o,0)*.7);background:radial-gradient(circle,#fff 0 .6px,transparent 1.2px) 0 0/6px 6px,radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.8px) 3px 2px/13px 11px;clip-path:inset(var(--ay,10%) var(--ax2,7.5%) var(--ay2,47%) var(--ax,7.5%))}
.tc3[data-ht="reverse"] .tf-holo{mix-blend-mode:color-dodge;opacity:calc(var(--o,0)*.6);background:repeating-linear-gradient(125deg,hsl(190 90% 60%) 0,hsl(280 85% 66%) 5%,hsl(40 95% 60%) 10%,hsl(130 80% 56%) 15%,hsl(190 90% 60%) 20%);background-size:260% 260%;background-position:var(--x) var(--y);
  -webkit-mask:linear-gradient(#000,#000) 0 0/100% 100%,linear-gradient(#000,#000) var(--ax,7.5%) var(--ay,10%)/calc(100% - var(--ax,7.5%) - var(--ax2,7.5%)) calc(100% - var(--ay,10%) - var(--ay2,47%)) no-repeat;-webkit-mask-composite:xor;mask-composite:exclude}
.tc3[data-ht="cosmos"] .tf-holo{mix-blend-mode:color-dodge;opacity:calc(var(--o,0)*.6);background:linear-gradient(115deg,hsl(265 85% 62%),hsl(195 95% 60%),hsl(320 90% 66%),hsl(50 95% 62%));background-size:240% 240%;background-position:var(--x) var(--y);
  -webkit-mask:radial-gradient(circle,#000 0 2.2px,transparent 3px) 0 0/17px 19px,radial-gradient(circle,#000 0 4px,transparent 5px) 7px 11px/31px 27px;clip-path:inset(var(--ay,10%) var(--ax2,7.5%) var(--ay2,47%) var(--ax,7.5%))}
.tc3[data-ht="texturizada"] .tf-holo{mix-blend-mode:color-dodge;opacity:calc(var(--o,0)*.75);background:linear-gradient(115deg,hsl(330 85% 62%),hsl(45 95% 60%),hsl(170 85% 55%),hsl(250 90% 66%),hsl(330 85% 62%));background-size:260% 260%;background-position:var(--x) var(--y);
  -webkit-mask:radial-gradient(circle at var(--x) var(--y),#000 0,rgba(0,0,0,.7) 20%,transparent 55%),repeating-linear-gradient(32deg,transparent 0 2.4px,#000 2.4px 3.4px);-webkit-mask-composite:source-in;mask-composite:intersect}
.tc3[data-ht="arcoiris"] .tf-holo{mix-blend-mode:color-dodge;opacity:calc(var(--o,0)*.5);background:linear-gradient(125deg,hsl(0 90% 75%),hsl(45 95% 72%),hsl(110 70% 70%),hsl(185 85% 70%),hsl(250 85% 78%),hsl(310 85% 78%),hsl(360 90% 75%));background-size:160% 160%;background-position:var(--x) var(--y)}
.tc3[data-ht="oro"] .tf-holo{mix-blend-mode:overlay;opacity:calc(var(--o,0)*1);background:linear-gradient(115deg,transparent 28%,rgba(255,246,200,.9) 44%,rgba(233,185,58,.95) 51%,rgba(255,242,176,.9) 57%,transparent 72%);background-size:260% 260%;background-position:var(--x) var(--y)}
.tc3[data-ht="oro"] .tf-holo2{mix-blend-mode:color-dodge;opacity:calc(var(--o,0)*.5);background:repeating-linear-gradient(90deg,rgba(255,226,140,.3) 0 1px,transparent 1px 3px)}
.tc3[data-ht="radiante"] .tf-holo{mix-blend-mode:color-dodge;opacity:calc(var(--o,0)*.7);background:linear-gradient(120deg,hsl(195 90% 62%),hsl(280 85% 68%),hsl(40 95% 62%),hsl(150 80% 58%),hsl(330 85% 66%));background-size:260% 260%;background-position:var(--x) var(--y);
  -webkit-mask:radial-gradient(circle at var(--x) var(--y),#000 0,rgba(0,0,0,.6) 22%,transparent 58%),repeating-linear-gradient(60deg,transparent 0 9px,rgba(0,0,0,.5) 9px 10px),repeating-linear-gradient(-60deg,transparent 0 9px,rgba(0,0,0,.5) 9px 10px);-webkit-mask-composite:source-in}
.tc3[data-ht="none"] .tf-holo{display:none}
.tf-spk{position:absolute;inset:0;pointer-events:none}
.tf-spk i{position:absolute;width:14px;aspect-ratio:1;margin:-7px 0 0 -7px;opacity:0;mix-blend-mode:screen;animation:twk 2.4s ease-in-out infinite;
  background:radial-gradient(circle,#fff 0 8%,rgba(255,240,190,.6) 16%,transparent 34%),linear-gradient(90deg,transparent 46%,rgba(255,250,220,.9) 50%,transparent 54%),linear-gradient(0deg,transparent 46%,rgba(255,250,220,.9) 50%,transparent 54%)}
@keyframes twk{0%,100%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1) rotate(25deg)}60%{opacity:.6;transform:scale(.8)}}
.tc-shadow{position:absolute;left:8%;right:8%;bottom:-7%;height:9%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.75),transparent 70%);filter:blur(6px);pointer-events:none;transition:transform .45s}
.tc-refl{position:absolute;left:0;right:0;top:calc(100% + 18px);height:44%;overflow:hidden;pointer-events:none;opacity:.8;
  -webkit-mask-image:linear-gradient(rgba(0,0,0,.35),transparent 80%);mask-image:linear-gradient(rgba(0,0,0,.35),transparent 80%);transform-origin:50% 0}
.tc-refl img{display:block;width:100%;aspect-ratio:.716;object-fit:cover;transform:scaleY(-1);border-radius:4.6%/3.3%;filter:blur(2px)}
.tc3.flipped .tc-refl,.tc3.zoomed .tc-refl,.tc3.zoomed .tc-shadow{opacity:0}

#sheet .zs{padding-bottom:40px}

.tc3[data-ht="oro"] .tf-holo2{mix-blend-mode:overlay!important;opacity:calc(.12 + var(--o,0)*.35)!important;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,240,190,.9),transparent 45%),repeating-linear-gradient(90deg,rgba(255,226,140,.35) 0 1px,transparent 1px 3px)!important;clip-path:none!important}

<body>
<div id="lock">
  <img src="icon-192.png" alt="">
  <h1>PokeIndex</h1>
  <p>Tus binders, tal como quedaron en el último guardado del ordenador. Escribe tu contraseña para abrirlos.</p>
  <form id="lf"><input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" required>
    <label class="chk"><input id="rem" type="checkbox" checked> Recordar en este móvil</label>
    <button class="btn" type="submit">Abrir</button><div class="err" id="perr"></div></form>
</div>
<div id="app" class="hide">
  <header><button class="back hide" id="back" aria-label="Atrás">‹</button><h2 id="ttl">Mis binders<small id="sub"></small></h2></header>
  <main id="view"></main>
  <nav><button data-t="home" class="on"><i>▦</i>Binders</button><button data-t="all"><i>⌕</i>Buscar</button><button data-t="scan"><i>⌖</i>Escanear</button><button data-t="more"><i>⋯</i>Más</button></nav>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const eur=v=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',useGrouping:'always'}).format(v||0);
const num=v=>(v!==undefined&&v!==null&&v!==''&&isFinite(+v))?+v:null;
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEYK='pi-movil-key';
let META=null,KEY=null,D=null,IMG={},stack=[],tab='home';
const bust=()=>'?t='+Date.now();
async function getMeta(){const r=await fetch('data/meta.json'+bust(),{cache:'no-store'});if(!r.ok)throw new Error('Todavía no hay datos publicados desde el ordenador.');return r.json()}
async function deriveKey(pw,m){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(m.salt),iterations:m.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function dec(buf,key){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key||KEY,u.slice(12))}
async function getBin(name){const r=await fetch('data/'+name+'?v='+(META.h[name]||Date.now()));if(!r.ok)throw new Error('No se pudo descargar '+name);return r.arrayBuffer()}
async function tryKey(key){const t=await dec(b64d(META.check),key);return new TextDecoder().decode(t)==='pokeindex'}
async function unlock(pw,remember){const key=await deriveKey(pw,META);if(!await tryKey(key).catch(()=>false))throw new Error('Contraseña incorrecta.');
  KEY=key;try{const raw=await crypto.subtle.exportKey('raw',key);sessionStorage.setItem(KEYK,JSON.stringify({s:META.salt,k:btoa(String.fromCharCode(...new Uint8Array(raw)))}))}catch(e){}if(remember){try{const raw=await crypto.subtle.exportKey('raw',key);localStorage.setItem(KEYK,JSON.stringify({s:META.salt,k:btoa(String.fromCharCode(...new Uint8Array(raw)))}))}catch(e){}}}
async function savedKey(){try{const o=JSON.parse(sessionStorage.getItem(KEYK)||localStorage.getItem(KEYK)||'null');if(!o||o.s!==META.salt)return null;
  const k=await crypto.subtle.importKey('raw',b64d(o.k),{name:'AES-GCM'},true,['decrypt']);return await tryKey(k).catch(()=>false)?k:null}catch(e){return null}}
async function loadAll(){const t=el('div','load','Cargando…');document.body.appendChild(t);
  try{D=JSON.parse(new TextDecoder().decode(await dec(await getBin('d.bin'))));
    show();
    let n=0;await Promise.all((META.imgs||[]).map(async f=>{try{const o=JSON.parse(new TextDecoder().decode(await dec(await getBin(f))));Object.assign(IMG,o)}catch(e){}n++;t.textContent=`Imágenes ${n}/${META.imgs.length}`}));
    render()}catch(e){alert(e.message||e)}finally{t.remove()}}
function show(){$('#lock').classList.add('hide');$('#app').classList.remove('hide');render()}
/* ---------- datos ---------- */
const imgOf=c=>c.im?(IMG[c.im]||''):(c.img||'');
const stCls=s=>s==='obtenida'?'ok':s==='comprada'?'buy':'mis';
const stTxt=(c,b)=>b&&b.kind==='ventas'?(c.st==='comprada'?'Vendida':'En venta'):c.st==='obtenida'?'La tengo':c.st==='comprada'?'Comprada':'Me falta';
function allCards(){const out=[];D.binders.forEach(b=>b.pages.forEach((pg,p)=>{if(p===0)return;pg.forEach((c,i)=>{if(c)out.push({b,p,i,c})})}));return out}
function stats(b){let n=0,g=0,v=0,miss=0,inv=0,pf=0;b.pages.forEach((pg,p)=>{if(p===0)return;pg.forEach(c=>{if(!c)return;n++;const a=num(c.pc),bp=num(c.pp);
  if(c.st==='obtenida'){g++;v+=a||0}else if(c.st==='comprada')v+=a||0;else miss+=a||0;if(bp!==null){inv+=bp;if(a!==null)pf+=a-bp}})});return{n,g,v,miss,inv,pf}}
/* ---------- vistas ---------- */
function setHead(t,s,back){$('#ttl').firstChild.textContent=t;$('#sub').textContent=s||'';$('#back').classList.toggle('hide',!back)}
function render(){const v=$('#view');v.innerHTML='';const top=stack[stack.length-1];
  if(top)return top.f(v);
  if(tab==='home')home(v);else if(tab==='all')search(v);else more(v)}
function go(f){stack.push({f});render();scrollTo(0,0)}
$('#back').onclick=()=>{stack.pop();render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.t==='scan'){location.href='scan.html';return}tab=b.dataset.t;stack=[];document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0)});
addEventListener('popstate',()=>{});
const when=iso=>{const d=new Date(iso);return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})};
function home(v){setHead('Mis binders','Guardado en el PC el '+when(D.at));
  const KS='pi-movil-kpi';let sel=null;try{sel=JSON.parse(localStorage.getItem(KS)||'null')}catch(e){}
